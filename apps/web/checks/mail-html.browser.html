<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mail HTML security self-check</title>
  </head>
  <body>
    <p id="result">Running sanitizer checks…</p>
    <script type="module">
      import { buildMailHtmlDocument } from '/src/features/inbox/utils/mail-html.ts'
      const assert = (condition, message) => {
        if (!condition) throw new Error(message)
      }
      try {
        const source =
          '<html><head><style>h1{color:red}</style><meta http-equiv="refresh" content="0;url=https://example.test"><base href="https://example.test"></head><body><h1 id="location">Mail</h1><script>alert(1)<\/script><img src="https://example.test/tracker" onerror="alert(1)"><a href="javascript:alert(1)">unsafe</a><a href="https://example.test">safe</a><iframe srcdoc="bad"></iframe><form><input></form><svg onload="alert(1)"></svg></body></html>'
        const clean = buildMailHtmlDocument(source)
        const parsed = new DOMParser().parseFromString(clean, 'text/html')
        assert(
          !parsed.querySelector('script,iframe,form,input,svg,base'),
          'Executable/embed/form tags survive',
        )
        assert(
          !parsed.querySelector('[onerror],[onload],[srcdoc]'),
          'Executable attributes survive',
        )
        assert(
          parsed.querySelector('h1')?.textContent === 'Mail',
          'Content lost',
        )
        assert(
          parsed.querySelector('style')?.textContent === 'h1{color:red}',
          'Email styles lost',
        )
        assert(
          parsed.querySelector('a')?.getAttribute('href') === null,
          'Unsafe link survives',
        )
        const safe = parsed.querySelectorAll('a')[1]
        assert(
          safe.target === '_blank' && safe.rel === 'noopener noreferrer',
          'External link lacks isolation',
        )
        const policy = parsed.querySelector('meta').content
        assert(
          policy.includes("script-src 'none'") &&
            policy.includes('img-src data: https: http:;'),
          'CSP must block scripts and allow automatic images',
        )
        assert(
          parsed.querySelectorAll('meta[http-equiv]').length === 1,
          'Sender CSP/redirect meta survives',
        )
        assert(
          parsed.querySelector('meta[name="referrer"]')?.content ===
            'no-referrer',
          'Images can disclose the workbench URL',
        )
        document.querySelector('#result').textContent =
          'PASS: HTML content/styles, scripts, forms, embeds, event handlers, links, CSP and automatic external images'
      } catch (error) {
        document.querySelector('#result').textContent = `FAIL: ${error.message}`
        console.error(error)
      }
    </script>
  </body>
</html>
