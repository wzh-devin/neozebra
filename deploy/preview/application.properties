# Private read-only integration: no demo upload/delete or arbitrary file sources.
file.upload.disable=true
delete.password=false
kk.scriptjs=false
kk.ignore.ssl=false
kk.enable.redirect=false
cache.type=jdk
cache.enabled=true
cache.clean.enabled=true
cache.clean.cron=0 0 * * * ?
server.compression.enabled=false
office.plugin.server.ports=2001
office.plugin.task.timeout=90s
office.plugin.task.taskexecutiontimeout=90s
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Source tickets occur in URLs; do not record them in routine request logs.
logging.level.cn.keking.web.controller.OnlinePreviewController=WARN
logging.level.cn.keking.utils.DownloadUtils=WARN
logging.level.cn.keking.web.controller=ERROR
